name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Build (skip GUI tests)
        run: mvn -B -ntp -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: bri-analysis-${{ matrix.os }}
          path: target/bri-analysis-*.jar
          if-no-files-found: error
